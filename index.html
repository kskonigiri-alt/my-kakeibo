<!doctype html><html lang="ja"><meta charset="utf-8"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MY家計簿</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef3fb;font:15px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:780px;margin:auto;padding:18px 13px 65px}h1{font-size:23px;margin:5px 0 15px}h2{font-size:17px}button,input,select{font:inherit}button{background:#33435c;color:white;border:0;border-radius:9px;padding:9px;cursor:pointer}button.sel,.green{background:#168c7c}button.small{font-size:12px;padding:6px 9px}.card{background:#1e2a3c;border:1px solid #36465c;border-radius:14px;padding:14px;margin:12px 0}.nav,.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.nav{margin:15px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cards .card{margin:0}.muted{color:#9aabc0;font-size:12px}.num{font-size:22px;font-weight:750;overflow-wrap:anywhere;margin-top:6px}.neg{color:#ff98a7}.pos{color:#80dec0}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #354258;padding:10px 0;gap:8px}.row:last-child{border:0}.day{color:#86d9c4;font-weight:bold;margin-top:17px}.controls{display:flex;align-items:center;gap:5px}.controls strong{font-size:13px}label{display:block;margin:12px 0 4px;color:#bbc9db;font-size:12px}input,select{width:100%;padding:11px;background:#111c2c;color:white;border:1px solid #506078;border-radius:9px}.hide{display:none}table{border-collapse:collapse;min-width:520px;width:100%;font-size:12px}td,th{border-bottom:1px solid #405068;padding:10px;text-align:right}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#1e2a3c}.scroll{overflow-x:auto}.modalback{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center}.modal{background:#1e2a3c;padding:18px;width:100%;max-width:550px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0}.note{color:#9aabc0;font-size:12px;line-height:1.6}.pill{font-size:11px;color:#a9eddf}.wide{width:100%;margin-top:14px}@media(min-width:700px){.modalback{align-items:center}.modal{border-radius:18px}}</style><main><div class="between"><h1>MY 家計簿</h1><button onclick="settings()">⚙ 設定</button></div><div class="nav"><button onclick="shift(-1)">‹ 前月</button><b id="period"></b><button onclick="shift(1)">翌月 ›</button></div><div class="between"><button id="monthBtn" class="sel" onclick="tab('month')">月別入力</button><button id="compareBtn" onclick="tab('compare')">Numbers風 比較</button></div><div class="cards"><div class="card"><div class="muted">残予定合計</div><div id="planned" class="num"></div></div><div class="card"><div class="muted">現在残高（入出金済）</div><div id="actual" class="num"></div></div></div><div class="card"><div class="between"><b>月間予算</b><button class="small" onclick="budgetEdit()">設定</button></div><div class="row"><span>支出予定</span><strong id="expense"></strong></div><div class="row"><span>予算残り</span><strong id="remaining"></strong></div></div><section id="monthView"><div class="card"><div class="between"><h2>日付別の収支</h2><button class="small green" onclick="addItem()">＋項目</button></div><div id="rows"></div></div><div class="card"><div class="between"><h2>その他出費</h2><button class="small green" onclick="addExtra()">＋明細</button></div><div id="extras"></div></div><div class="card"><h2>集計</h2><div class="row">収入合計 <strong id="income"></strong></div><div class="row">支出合計 <strong id="outgo"></strong></div><div class="row">前月繰越（予定） <strong id="carry"></strong></div><div class="row">追加額 <span><strong id="adjust"></strong> <button class="small" onclick="editAdjust()">編集</button></span></div><div class="row"><b>再合計</b><strong id="recalc"></strong></div></div></section><section id="compareView" class="hide"><div class="card"><h2>3か月比較</h2><div class="scroll"><table id="comparison"></table></div></div></section><p class="note">試作品：保存先はこのブラウザ内です。クラウド保存・ログインは未実装。設定からバックアップを保存してください。予定額は支払いチェックに関係なく予定残高に反映され、現在残高にはチェック済みの入出金だけが反映されます。</p></main><div id="back" class="modalback hide"><div class="modal"><div class="between"><h2 id="modalTitle"></h2><button onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><script>
const key='personal_kakeibo_prototype_v2';let s;try{s=JSON.parse(localStorage.getItem(key))||{}}catch{s={}}s.months??={};s.opening??=0;s.start??=null;s.budget??=0;
const tpl=[['15','給与','in',0,'variable'],['15','副業','in',0,'variable'],['15','臨時収入','in',0,'variable'],['15','生活費','out',50000,'fixed'],['15','仕送り','out',30000,'fixed'],['16','ニーサ','out',10000,'fixed'],['16','水道代','out',0,'variable'],['16','ガス・電気','out',0,'variable'],['20','ジム代','out',13200,'fixed'],['26','生命保険','out',9222,'fixed'],['26','返済金','out',20000,'fixed'],['27','家賃','out',69483,'fixed'],['27','携帯料金','out',0,'variable'],['next14','タイムズ会費','out',880,'fixed']];
function mk(y,m){return y+'-'+String(m).padStart(2,'0')}function move(k,n){let [y,m]=k.split('-').map(Number);let d=new Date(y,m-1+n,15);return mk(d.getFullYear(),d.getMonth()+1)}let d=new Date(),cur=mk(d.getFullYear(),d.getMonth()+1);if(d.getDate()<15)cur=move(cur,-1);function save(){localStorage.setItem(key,JSON.stringify(s))}function month(k){if(!s.months[k]){let prev=s.months[move(k,-1)];s.months[k]={items:prev?prev.items.map(x=>({...x,amount:x.repeat==='fixed'?x.amount:0,paid:false})):tpl.map((t,i)=>({id:'t'+i,day:t[0],name:t[1],kind:t[2],amount:t[3],repeat:t[4],paid:false})),extras:[],adjust:0};save()}return s.months[k]}function totals(k){let m=month(k),all=[...m.items,...m.extras];let inc=all.filter(x=>x.kind==='in').reduce((a,x)=>a+Number(x.amount||0),0),out=all.filter(x=>x.kind==='out').reduce((a,x)=>a+Number(x.amount||0),0),actual=all.filter(x=>x.paid).reduce((a,x)=>a+(x.kind==='in'?1:-1)*Number(x.amount||0),0);return {inc,out,net:inc-out,actual,adjust:Number(m.adjust||0)}}function rangeSum(k,real){if(!s.start)return null;let total=s.opening;for(let i=0,p=s.start;i<240&&p<=k;i++,p=move(p,1)){let t=totals(p);total+=real?t.actual:t.net+t.adjust}return total}function carry(k){return s.start?rangeSum(move(k,-1),false):null}function yen(x){return(x<0?'−':'')+'¥'+Math.abs(Math.round(x)).toLocaleString('ja-JP')}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(x){return document.getElementById(x)}
function render(){let m=month(cur),t=totals(cur),a=rangeSum(cur,true),c=carry(cur);id('period').textContent=cur.replace('-','年')+'月（15日〜翌14日）';id('planned').textContent=yen(t.net);id('planned').className='num '+(t.net<0?'neg':'pos');id('actual').textContent=a===null?'未設定':yen(a);id('actual').className='num '+(a!==null&&a<0?'neg':'');id('income').textContent=yen(t.inc);id('outgo').textContent=id('expense').textContent=yen(t.out);id('remaining').textContent=s.budget?yen(s.budget-t.out):'未設定';id('carry').textContent=c===null?'未設定':yen(c);id('adjust').textContent=yen(t.adjust);id('recalc').textContent=yen((c||0)+t.net+t.adjust);let groups=['15','16','20','26','27','next14'];id('rows').innerHTML=groups.map(g=>'<div class="day">'+(g==='next14'?'翌14日':g+'日')+'</div>'+m.items.filter(x=>x.day===g).map(x=>line(x,false)).join('')).join('')+m.items.filter(x=>!groups.includes(x.day)).map(x=>line(x,false)).join('');id('extras').innerHTML=m.extras.length?m.extras.map(x=>line(x,true)).join(''):'<p class="note">まだ明細はありません。</p>';renderCompare()}
function line(x,extra){return '<div class="row"><div><div>'+esc(x.name)+'</div><div class="muted">'+(extra?esc(x.date):'')+'</div></div><div class="controls"><strong>'+yen(x.amount)+'</strong><button class="small '+(x.paid?'green':'')+'" onclick="paid(\''+x.id+'\','+extra+')">'+(x.paid?'済':'未')+'</button><button class="small" onclick="edit(\''+x.id+'\','+extra+')">編集</button></div></div>'}function renderCompare(){let ks=[move(cur,-1),cur,move(cur,1)];let html='<tr><th>項目</th>'+ks.map(k=>'<th>'+k+'</th>').join('')+'</tr>';for(let t of tpl){let i=tpl.indexOf(t);html+='<tr><td>'+t[0]+'日 '+esc(t[1])+'</td>'+ks.map(k=>'<td>'+yen(month(k).items.find(x=>x.id==='t'+i)?.amount||0)+'</td>').join('')+'</tr>'}for(let [name,f] of [['その他出費',k=>month(k).extras.reduce((a,x)=>a+Number(x.amount),0)],['残予定合計',k=>totals(k).net],['追加額',k=>totals(k).adjust],['再合計',k=>(carry(k)||0)+totals(k).net+totals(k).adjust]])html+='<tr><th>'+name+'</th>'+ks.map(k=>'<th>'+yen(f(k))+'</th>').join('')+'</tr>';id('comparison').innerHTML=html}
function shift(n){cur=move(cur,n);render()}function tab(t){id('monthView').classList.toggle('hide',t!=='month');id('compareView').classList.toggle('hide',t!=='compare');id('monthBtn').classList.toggle('sel',t==='month');id('compareBtn').classList.toggle('sel',t==='compare');render()}function paid(item,extra){let x=(extra?month(cur).extras:month(cur).items).find(x=>x.id===item);x.paid=!x.paid;save();render()}function modal(title,body){id('modalTitle').textContent=title;id('modalBody').innerHTML=body;id('back').classList.remove('hide')}function closeModal(){id('back').classList.add('hide')}function field(label,name,value,type='text'){return '<label>'+label+'</label><input id="f_'+name+'" type="'+type+'" value="'+esc(value??'')+'">'}function val(n){return id('f_'+n).value}function option(name,opts,v){return '<label>'+name+'</label><select id="f_'+name+'">'+opts.map(o=>'<option value="'+o[0]+'" '+(v===o[0]?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>'}const days=['15','16','20','26','27','next14'].map(x=>[x,x==='next14'?'翌14日':x+'日']);function edit(item,extra){let x=(extra?month(cur).extras:month(cur).items).find(x=>x.id===item);modal('項目を編集',field('内容','name',x.name)+field('金額','amount',x.amount,'number')+(extra?field('日付','date',x.date,'date'):option('日付',days,x.day))+option('引継ぎ',[['fixed','項目と金額'],['variable','項目のみ']],x.repeat)+'<button class="wide green" onclick="saveEdit(\''+item+'\','+extra+')">保存</button><button class="wide" onclick="del(\''+item+'\','+extra+')">削除</button>')}function saveEdit(item,extra){let x=(extra?month(cur).extras:month(cur).items).find(x=>x.id===item);if(!val('name').trim())return alert('内容を入力してください');x.name=val('name').trim();x.amount=Math.max(0,Number(val('amount'))||0);x.repeat=val('引継ぎ');if(extra)x.date=val('date');else x.day=val('日付');save();closeModal();render()}function del(item,extra){if(!confirm('削除しますか？'))return;let m=month(cur),prop=extra?'extras':'items';m[prop]=m[prop].filter(x=>x.id!==item);save();closeModal();render()}
function addExtra(){modal('その他出費を追加',field('内容','name','')+field('金額','amount','','number')+field('使用日','date',new Date().toLocaleDateString('sv-SE'),'date')+'<button class="wide green" onclick="saveExtra()">追加する</button>')}function saveExtra(){let name=val('name').trim(),amount=Number(val('amount')),date=val('date');if(!name||!(amount>0)||!date)return alert('内容・金額・日付を入力してください');let d=new Date(date+'T12:00:00'),k=mk(d.getFullYear(),d.getMonth()+1);if(d.getDate()<15)k=move(k,-1);month(k).extras.push({id:'e'+Date.now(),name,amount,date,kind:'out',paid:true,repeat:'variable'});cur=k;save();closeModal();render()}function addItem(){modal('項目を追加',field('内容','name','')+field('金額','amount',0,'number')+option('収支',[['out','支出'],['in','収入']],'out')+option('日付',days,'15')+option('引継ぎ',[['variable','項目のみ'],['fixed','項目と金額']],'variable')+'<button class="wide green" onclick="saveNew()">追加する</button>')}function saveNew(){if(!val('name').trim())return alert('内容を入力してください');month(cur).items.push({id:'n'+Date.now(),name:val('name').trim(),amount:Math.max(0,Number(val('amount'))||0),kind:val('収支'),day:val('日付'),repeat:val('引継ぎ'),paid:false});save();closeModal();render()}function budgetEdit(){modal('月間予算',field('予算額','budget',s.budget,'number')+'<button class="wide green" onclick="s.budget=Math.max(0,Number(val(\'budget\'))||0);save();closeModal();render()">保存</button>')}function editAdjust(){modal('追加額',field('追加額（マイナス可）','adjust',month(cur).adjust,'number')+'<button class="wide green" onclick="month(cur).adjust=Number(val(\'adjust\'))||0;save();closeModal();render()">保存</button><p class="note">追加額は予定残高の調整です。現在残高への入出金は収入・支出項目で記録してください。</p>')}function settings(){modal('設定・バックアップ',field('初期残高','opening',s.opening,'number')+field('初期残高の基準月（15日開始）','start',s.start||cur,'month')+'<button class="wide green" onclick="s.opening=Number(val(\'opening\'))||0;s.start=val(\'start\');save();closeModal();render()">初期残高を保存</button><button class="wide" onclick="backup()">バックアップを書き出す</button><label>バックアップを読み込む</label><input type="file" accept=".json,application/json" onchange="restore(this)"><p class="note">データは端末のブラウザ内に保存されます。iCloudなど安全な場所へバックアップしてください。</p>')}function backup(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kakeibo-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function restore(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.months||typeof v.months!=='object')throw Error();if(!confirm('現在のデータをバックアップで置き換えますか？'))return;s=v;save();closeModal();render()}catch{alert('読み込めないファイルです')}};r.readAsText(f)}render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});</script></html>
